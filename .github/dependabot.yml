version: 2
updates:
  # Dependências do frontend (package.json/pnpm-lock.yaml) — "npm" é o ecosystem correto no
  # Dependabot também pra projetos pnpm (ele lê o pnpm-lock.yaml normalmente).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Mantém as próprias actions usadas em .github/workflows/ci.yml em dia (actions/checkout,
  # actions/setup-node, pnpm/action-setup, etc.) — mesma lógica de segurança, escopo diferente.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
